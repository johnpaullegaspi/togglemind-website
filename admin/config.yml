# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  # Direct GitHub backend, authenticated through Netlify's built-in
  # OAuth relay — free, no DecapBridge subscription, no per-publish
  # credits. See README.md's "Deployment" section for the one-time
  # GitHub OAuth App + Netlify "Install provider" setup.
  name: github
  repo: johnpaullegaspi/togglemind-website
  branch: main

media_folder: "assets/images"
public_folder: "assets/images"

site_url: https://togglemind.netlify.app
display_url: https://togglemind.netlify.app
logo_url: /assets/images/logo-icon.png

# Every content change triggers a Netlify build (netlify.toml runs
# `node scripts/build.js`), which regenerates index.html from these
# JSON files — the live site is always plain static HTML, never
# rendered client-side.
publish_mode: simple

# ---------------------------------------------------------------------
# Single-file content model.
#
# Everything the site displays lives in ONE JSON file, _content/site.json,
# edited as ONE Sveltia CMS entry ("Website Content"). Every section below
# (Site Settings, Hero, About, Profile, Services, Industries, Process, Why
# Choose Us, Results, Technologies, FAQ, Contact) is just a field group or
# a list *inside* that one entry — there's only one "Save" button for the
# whole site. Edit as many fields, in as many sections, as you want, then
# save once: that's one Git commit, one Netlify build, no matter how much
# you changed. This replaces an earlier version of this project that used
# a separate file per section (and, for Services/Industries/etc., a
# separate file per *item*) — that meant one Netlify build per section
# per save, which is exactly what this consolidation avoids.
#
# Trade-off: the editor page is longer to scroll through since every
# section lives on one screen. Given the goal is minimizing publishes,
# that's the right trade for this site.
# ---------------------------------------------------------------------
collections:
  - name: "site"
    label: "Website Content"
    files:
      - name: "content"
        label: "Everything (one save = one publish)"
        file: "_content/site.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Site Settings"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Site Title", name: "title", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Meta Description", name: "description", widget: "text" }
              - { label: "Contact Email", name: "email", widget: "string" }
              - { label: "Contact Phone (e.g. +63 994 504 0628)", name: "phone", widget: "string" }
              - { label: "Facebook Page URL", name: "facebook", widget: "string", hint: "Full URL, e.g. https://fb.com/togglemind" }

          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Highlighted Word", name: "highlight", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Primary Button Label", name: "cta_primary", widget: "string" }
              - { label: "Secondary Button Label", name: "cta_secondary", widget: "string" }
              - { label: "Hero Photo", name: "image", widget: "image" }
              - { label: "Hero Photo Alt Text", name: "image_alt", widget: "string" }

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Section Label", name: "label", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph 1", name: "paragraph_1", widget: "text" }
              - { label: "Paragraph 2", name: "paragraph_2", widget: "text" }
              - { label: "Paragraph 3", name: "paragraph_3", widget: "text" }

          - label: "Profile Card"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Stat 1 Value", name: "stat_1_value", widget: "string" }
              - { label: "Stat 1 Label", name: "stat_1_label", widget: "string" }
              - { label: "Stat 2 Value", name: "stat_2_value", widget: "string" }
              - { label: "Stat 2 Label", name: "stat_2_label", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Photo Alt Text", name: "photo_alt", widget: "string" }

          - label: "Services"
            name: "services"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Service Name", name: "title", widget: "string" }
              - { label: "Icon", name: "icon", widget: "select", options: ["monitor", "settings", "bar-chart"] }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Features"
                name: "features"
                widget: "list"
                allow_add: true
              - { label: "Display Order", name: "order", widget: "number", hint: "Lower numbers show first" }

          - label: "Industries"
            name: "industries"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Industry Name", name: "title", widget: "string" }
              - { label: "Icon Emoji", name: "icon", widget: "string" }
              - { label: "Display Order", name: "order", widget: "number", hint: "Lower numbers show first" }

          - label: "Process Steps"
            name: "process"
            widget: "list"
            summary: "{{number}}. {{title}}"
            fields:
              - { label: "Step Number", name: "number", widget: "number" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Why Choose Us"
            name: "why_us"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Icon", name: "icon", widget: "select", options: ["shield", "zap", "users", "star", "layout", "message-circle", "check-circle", "trending-up"] }
              - { label: "Display Order", name: "order", widget: "number", hint: "Lower numbers show first" }

          - label: "Results"
            name: "results"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Icon Emoji", name: "icon", widget: "string" }
              - { label: "Display Order", name: "order", widget: "number", hint: "Lower numbers show first" }

          - label: "Technologies"
            name: "technologies"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Technology Name", name: "title", widget: "string" }
              - { label: "Display Order", name: "order", widget: "number", hint: "Lower numbers show first" }

          - label: "FAQ"
            name: "faq"
            widget: "list"
            summary: "{{question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
              - { label: "Display Order", name: "order", widget: "number", hint: "Lower numbers show first" }

          - label: "Portfolio"
            name: "portfolio"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Project Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string", hint: "e.g. Real Estate, Restaurant, Dental Clinic" }
              - { label: "Short Description", name: "description", widget: "text", required: false }
              - { label: "Featured Image", name: "image", widget: "image", hint: "Upload a thumbnail/preview image of the website (recommended ~1200x750, landscape)" }
              - { label: "Live Website URL", name: "url", widget: "string", hint: "Full URL, e.g. https://example.com" }
              - { label: "Display Order", name: "order", widget: "number", hint: "Lower numbers show first" }
              - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Featured projects are shown first" }
              - { label: "Active (Show on site)", name: "active", widget: "boolean", default: true, hint: "Turn off to hide this project without deleting it" }

          - label: "Contact Section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Button Label", name: "cta_primary", widget: "string" }
              - { label: "Button Link", name: "cta_primary_link", widget: "string", hint: "Where 'Book a Free Consultation' should go, e.g. a Calendly URL" }
