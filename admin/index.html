<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Manager — Toggle Mind AI</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
</head>
<body>
    <!--
      Sveltia CMS — a drop-in, actively-maintained replacement for Decap
      CMS. Reads the same admin/config.yml. Switched from decap-cms here
      because the git-gateway + DecapBridge combo required a paid proxy
      service billed per publish; Sveltia's GitHub backend authenticates
      directly via Netlify's built-in (free) OAuth relay instead — see
      the comments in config.yml for the one-time setup.

      Kept at the end of <body> as a safe default (same spot the old
      decap-cms tag needed). Pinned to an EXACT version, never a
      "^range" — Sveltia ships frequent releases, and an unpinned range
      can silently pull a breaking change into this admin panel with no
      code change on our side to point to. Do NOT add type="module" and
      do NOT add a separate stylesheet link — Sveltia's own docs warn
      the module attribute can cause the bundle to misbehave, and all
      required styles already ship bundled inside this one file.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.170.4/dist/sveltia-cms.js"></script>
</body>
</html>
